<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landscaping — Landscape Manager</title>
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('landscape-theme') || 'auto'; } catch (e) {}
</script>
<link rel="stylesheet" href="../../static/style.css">
</head>
<body>
<header>
  <strong>Landscaping</strong>
  <nav>
    <a href="../../">Dashboard</a>
    <a href="../../clients/">Clients</a>
    <a href="../">Jobs</a>
    <a href="../../services/">Services</a>
    <a href="../../quotes/">Quotes</a>
    <a href="../../invoices/">Invoices</a>
    <a href="../../settings/">Settings</a>
  </nav>
  <label class="theme-picker">Theme
    <select id="theme-picker" aria-label="Theme">
      <option value="auto">Auto</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
</header><div class="static-banner">Static demo — browsing only. Forms are disabled and nothing you enter here is saved. Run the Flask app locally for the full, working version.</div>
<main>




<h1>Schedule a job</h1>
<form method="post" onsubmit="return false;">
<label>Property <select name="property_id" required disabled=""><option value="1">Alex Rivera — Home (12 Oak Hollow Lane)</option><option value="2">Jordan Patel — Home (48 Maple Ridge Drive)</option><option value="3">Sam Whitfield — Home (7 Willow Creek Court)</option></select></label>
<label>Service <select name="service_id" required disabled=""><option value="5">Fertilizer Application — $55.00 per visit</option><option value="6">Garden Bed Weeding — $40.00 per hour</option><option value="2">Hedge Trimming — $65.00 per visit</option><option value="1">Lawn Mowing — $45.00 per visit</option><option value="4">Leaf Cleanup — $120.00 per visit</option><option value="3">Mulch Installation — $85.00 per cubic yard</option></select></label>
<label>Date <input type="date" name="scheduled_date" required disabled=""></label>
<label>Recurrence <select name="recurrence" disabled=""><option value="none">One-off</option><option value="weekly">Weekly</option><option value="biweekly">Every two weeks</option><option value="monthly">Monthly</option></select></label>
<label>Status <select name="status" disabled=""><option value="scheduled">Scheduled</option><option value="in_progress">In progress</option><option value="done">Done</option><option value="cancelled">Cancelled</option></select></label>
<label>Notes <textarea name="notes" disabled=""></textarea></label>
<button type="submit" disabled="">Save job</button>
</form>

</main>
<script>
(function () {
  var picker = document.getElementById('theme-picker');
  if (!picker) return;
  try { picker.value = localStorage.getItem('landscape-theme') || 'auto'; } catch (e) {}
  picker.addEventListener('change', function () {
    document.documentElement.dataset.theme = picker.value;
    try { localStorage.setItem('landscape-theme', picker.value); } catch (e) {}
  });
})();
</script>
</body>
</html>

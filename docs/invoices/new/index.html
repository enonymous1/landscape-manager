<header>

</header><div class="static-banner">Static demo — browsing only. Forms are disabled and nothing you enter here is saved. Run the Flask app locally for the full, working version.</div>
<main>




<h1>New invoice</h1>
<form method="post" onsubmit="return false;">
<label>Client <select name="client_id" required disabled=""><option value="1">Alex Rivera</option><option value="2">Jordan Patel</option><option value="3">Sam Whitfield</option></select></label>
<label>Property <select name="property_id" disabled=""><option value="">— none —</option><option value="1">Alex Rivera — Home</option><option value="2">Jordan Patel — Home</option><option value="3">Sam Whitfield — Home</option></select></label>
<label>Due date <input type="date" name="due_date" disabled=""></label>
<button type="submit" disabled="">Create invoice</button>
</form>
<p>Then add line items on the invoice page.</p>

</main>
<script>
(function () {
  var picker = document.getElementById('theme-picker');
  if (!picker) return;
  try { picker.value = localStorage.getItem('landscape-theme') || 'auto'; } catch (e) {}
  picker.addEventListener('change', function () {
    document.documentElement.dataset.theme = picker.value;
    try { localStorage.setItem('landscape-theme', picker.value); } catch (e) {}
  });
})();
</script>
</body>
</html>

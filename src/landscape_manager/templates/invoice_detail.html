{% extends "base.html" %}
{% block content %}
<h1>Invoice #{{ invoice.id }} — {{ invoice.client_name }}</h1>
<p>Status: {{ invoice.status }} · Due: {{ invoice.due_date }} · Created: {{ invoice.created_date }}</p>
{% include "_document_items.html" %}
{% if invoice.status != 'paid' %}
<form method="post"><input type="hidden" name="mark_paid" value="1"><button type="submit">Mark paid</button></form>
{% endif %}
{% endblock %}

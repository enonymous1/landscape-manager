{% extends "base.html" %}
{% block content %}
<h1>{% if client %}Edit client{% else %}Add client{% endif %}</h1>
<form method="post">
<label>Name <input name="name" value="{{ client.name if client else '' }}" required></label>
<label>Phone <input name="phone" value="{{ client.phone if client else '' }}"></label>
<label>Email <input name="email" value="{{ client.email if client else '' }}"></label>
<label>Address <input name="address" value="{{ client.address if client else '' }}"></label>
<label>Notes <textarea name="notes">{{ client.notes if client else '' }}</textarea></label>
<button type="submit">Save client</button>
</form>
{% endblock %}

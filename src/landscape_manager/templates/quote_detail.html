{% extends "base.html" %}
{% block content %}
<h1>Quote #{{ quote.id }} — {{ quote.client_name }}</h1>
<p>Status: {{ quote.status }} · Created: {{ quote.created_date }}</p>
{% if quote.notes %}<p>{{ quote.notes }}</p>{% endif %}
{% include "_document_items.html" %}
<h2>Status</h2>
<form method="post">
<label>Status <select name="status"><option value="draft">Draft</option><option value="sent">Sent</option><option value="accepted">Accepted</option><option value="declined">Declined</option></select></label>
<button type="submit">Update status</button>
</form>
<form method="post" action="{{ url_for('quote_convert', quote_id=quote.id) }}"><button type="submit">Convert to invoice</button></form>
{% endblock %}

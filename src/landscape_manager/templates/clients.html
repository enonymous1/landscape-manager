{% extends "base.html" %}
{% block content %}
<h1>Clients</h1>
<p><a class="btn" href="{{ url_for('client_new') }}">Add client</a></p>
<table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th></tr>
{% for c in clients %}<tr><td><a href="{{ url_for('client_detail', client_id=c.id) }}">{{ c.name }}</a></td><td>{{ c.phone }}</td><td>{{ c.email }}</td><td>{{ c.address }}</td></tr>{% endfor %}
</table>
{% endblock %}

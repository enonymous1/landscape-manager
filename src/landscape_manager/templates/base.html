<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ business_name }} — Landscape Manager</title>
<script>
try { document.documentElement.dataset.theme = localStorage.getItem('landscape-theme') || 'auto'; } catch (e) {}
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <strong>{{ business_name }}</strong>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('clients') }}">Clients</a>
    <a href="{{ url_for('jobs') }}">Jobs</a>
    <a href="{{ url_for('services') }}">Services</a>
    <a href="{{ url_for('quotes') }}">Quotes</a>
    <a href="{{ url_for('invoices') }}">Invoices</a>
    <a href="{{ url_for('settings') }}">Settings</a>
  </nav>
  <label class="theme-picker">Theme
    <select id="theme-picker" aria-label="Theme">
      <option value="auto">Auto</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </label>
</header>
<main>
{% with messages = get_flashed_messages() %}
{% if messages %}<ul class="flash">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<script>
(function () {
  var picker = document.getElementById('theme-picker');
  if (!picker) return;
  try { picker.value = localStorage.getItem('landscape-theme') || 'auto'; } catch (e) {}
  picker.addEventListener('change', function () {
    document.documentElement.dataset.theme = picker.value;
    try { localStorage.setItem('landscape-theme', picker.value); } catch (e) {}
  });
})();
</script>
</body>
</html>
